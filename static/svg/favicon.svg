<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4a32"/>
      <stop offset="100%" stop-color="#26331f"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8a96e" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8a6f3f" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="42" fill="url(#bg)"/>

  <!-- left wing -->
  <path d="M100 95 C 55 60, 20 75, 18 120 C 45 135, 80 125, 100 100 Z"
        fill="url(#wing)" stroke="#e8c878" stroke-width="1.5" opacity="0.9"/>
  <!-- right wing -->
  <path d="M100 95 C 145 60, 180 75, 182 120 C 155 135, 120 125, 100 100 Z"
        fill="url(#wing)" stroke="#e8c878" stroke-width="1.5" opacity="0.9"/>

  <!-- body -->
  <ellipse cx="100" cy="100" rx="14" ry="34" fill="#5b4326"/>
  <ellipse cx="100" cy="100" rx="14" ry="34" fill="none" stroke="#e8c878" stroke-width="1" opacity="0.4"/>

  <!-- head -->
  <circle cx="100" cy="72" r="13" fill="#6b4f2c"/>

  <!-- eyes -->
  <circle cx="93" cy="70" r="3.2" fill="#e8a23a"/>
  <circle cx="107" cy="70" r="3.2" fill="#e8a23a"/>

  <!-- antennae -->
  <path d="M95 64 C 90 56, 86 52, 84 46" stroke="#e8c878" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M105 64 C 110 56, 114 52, 116 46" stroke="#e8c878" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- body segments -->
  <line x1="92" y1="88" x2="108" y2="88" stroke="#e8c878" stroke-width="1" opacity="0.4"/>
  <line x1="91" y1="100" x2="109" y2="100" stroke="#e8c878" stroke-width="1" opacity="0.4"/>
  <line x1="92" y1="112" x2="108" y2="112" stroke="#e8c878" stroke-width="1" opacity="0.4"/>

  <!-- sound waves (cicada singing) -->
  <path d="M30 50 Q 22 60 30 70" stroke="#e8c878" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M170 50 Q 178 60 170 70" stroke="#e8c878" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
</svg>