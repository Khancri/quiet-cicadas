<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cicadas</title>
    <link rel="stylesheet" href="file/css/base.css">
    <link rel="stylesheet" href="file/css/emoji.css">
    <link rel="stylesheet" href="file/css/cropper.css">
    <link rel="stylesheet" href="file/css/chats.css">
    <link rel="stylesheet" href="file/css/account-page.css">
    <script type="module" src="file/js/chats.js" defer></script>

</head>

<template id="t-channelRanking">
    <div class="dm-item" data-channel-data="paramore">
        <div style="display: flex; gap: 8px; align-items: center;">
            <div class="avatar-sm">#</div><span>paramore</span>
        </div>
        <div class="channel-exit">⤬</div>   
    </div>
</template>

<template id="t-chatBox">
    <div id="channel-header">
        <div style="width: 100%; display: flex; flex-direction: row; justify-content: space-between;"><div style="display: flex; align-content: center; gap: 8px;"><h1 id="channel-name"></h1><span id="encryption-status">end-to-end encrypted</span></div></div><button id="allow-notifications">allow notifs</button>
    </div>
    <div class="messages" id="messages"></div>
    <div>
        <div id="typing-indicator" hidden>
            <span class="user">khancri</span> <span class="is-are">is</span> typing..
        </div>
        <div id="attachment-preview" hidden></div>
        <div style="display:flex; align-items:center; gap:6px; margin:10px 14px 12px;">
            <button id="attach-btn" type="button">📎</button>
            <input type="file" id="attachment-input" hidden>
            <input type="text" id="message-input" placeholder="say something..." style="margin:0;">
            <button id="emoji-picker-btn" type="button">😀</button>
        </div>
    </div>
</template>

<template id="t-message">
    <div class="message" data-id="2898afff-d35a-4cc2-806b-4eb06bf965be">
        <div class="avatar" style="background-size: cover;"></div>
        <div class="content">
            <div class="metadata"><b class="username">meow meow</b><span class="date">8/1/2026, 11:05:40 PM</span></div>
            <span class="messageContent">asdf</span>
            <div class="reaction-row" hidden></div>
        </div>
    </div>
</template>

<template id="t-userRanking">
    <div class="dm-item" data-friend-data="paramore">
        <div style="display: flex; gap: 8px; align-items: center; overflow: auto;">
            <div class="avatar-sm"><img src="" alt=""></div><span>paramore</span>
        </div>
        <div class="channel-exit">⤬</div>   
    </div>
</template>

<template id="t-chatBox">
    <div id="channel-header">
        <div style="width: 100%; display: flex; flex-direction: row; justify-content: space-between;"><div style="display: flex; align-content: center; gap: 8px;"><h1 id="channel-name"></h1><span id="encryption-status">end-to-end encrypted</span></div></div><button id="allow-notifications">allow notifs</button>
    </div>
    <div class="messages" id="messages"></div>
    <div>
        <div id="typing-indicator" hidden>
            <span class="user">khancri</span> <span class="is-are">is</span> typing..
        </div>
        <div id="attachment-preview" hidden></div>
        <div style="display:flex; align-items:center; gap:6px; margin:10px 14px 12px;">
            <button id="attach-btn" type="button">📎</button>
            <input type="file" id="attachment-input" hidden>
            <input type="text" id="message-input" placeholder="say something..." style="margin:0;">
            <button id="emoji-picker-btn" type="button">😀</button>
        </div>
    </div>
</template>

<template id="t-friendRanking">
    <div class="friendRanking" data-friend-data="paramore">
        <div style="display: flex; gap: 8px; align-items: center; overflow: auto;">
            <div class="avatar-sm"><img src="" alt=""></div><span>paramore</span>
        </div> 
        <button class="button message-user">message</button>
    </div>
</template>

<template id="t-friendRequest">
    <div class="friendRequest" data-friend-data="paramore">
        <div style="display: flex; gap: 8px; align-items: center; overflow: auto;">
            <div class="avatar-sm"><img src="" alt=""></div><span>paramore</span>
        </div> 
        <div style="display: flex; gap: 2px; align-items: center; overflow: auto; flex-direction: row;">
            <button class="button" data-action="accept">accept</button>
            <button class="button" data-action="decline">decline</button>
        </div>

    </div>
</template>

<template id="t-friendsList">
    <div id="add-friend">
        <h2>friend request here !</h2>
        <div>
            <input type="text" id="friend-request-field" placeholder="enter username to request...">
            <button class="button" id="friend-request-button">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5" />
                </svg>
            </button>
        </div>
        <p class="friend-status" hidden>this guy late to the party mann ●︿●</p>
    </div>
    <div id="requests" hidden>
        <h2>friend requests</h2>
    </div>

    <hr>
    
    <div id="friendsList" hidden>
        <h2>friends :)</h2>
    </div>
</template>

<body>
    <div id="context">
        <button class="emoji-context">react</button>
        <button class="reply-context">reply</button>
    </div>
    <div id="edit-profile" hidden>
        <h2>edit profile</h2>


        <div class="pfp-edit-wrap">
            <div class="overlay-label">change</div>
        </div>

        <div class="field">
            <label for="display-name">display name</label>
            <input id="display-name" type="text" value="jade" maxlength="32">
        </div>

        <div class="status-pronouns">
            <div class="field">
            <label for="status">status</label>
            <select id="status" maxlength="24">
                <option value="online">online</option>
                <option value="idle">idle</option>
                <option value="dnd">do not disturb.</option>
            </select>

            </div>
            <div class="field">
            <label for="pronouns">pronouns</label>
            <input id="pronouns" type="text" value="they/them" maxlength="20">
            </div>
        </div>

        <div class="field">
            <label for="bio">bio</label>
            <textarea id="bio" maxlength="160">building cicadas, an e2e encrypted discord alternative.</textarea>
            <span class="char-count">57 / 160</span>
        </div>

        <div class="field">
            <label>status</label>
            <div class="status-options">
            <div class="status-dot-btn active"><span class="dot online"></span>online</div>
            <div class="status-dot-btn"><span class="dot idle"></span>idle</div>
            <div class="status-dot-btn"><span class="dot dnd"></span>dnd</div>
            <div class="status-dot-btn"><span class="dot offline"></span>offline</div>
            </div>
        </div>

        <div class="field">
            <label for="custom-status">custom status</label>
            <input id="custom-status" type="text" placeholder="what's happening?" maxlength="60">
        </div>

        <div class="actions">
            <button class="btn" id="cancel-changes">cancel</button>
            <button class="btn primary" id="profile-update">save</button>
        </div>
    </div>
    <div id="profile">
        <div style="flex-direction: row; display: flex; align-items: center; justify-content: space-between;">
            <b id="modal-username">Khancri</b>
            <span class="date-created"><span style="font-size: 10px; color: var(--text-muted);">joined:</span><br><span class="date-created-info">Jan 1st, 1970</span></span>
        </div>
        <div style="flex-direction: row; display: flex; align-items: center; justify-content: space-between;"><p class="handle">@khancri</p><p class="pronouns">she/her</p></div>
        <div class="pfp-glow-wrap">
            <img src="pfp/khancri" class="modal-pfp">
        </div>
        <div class="bio">building cicadas, an e2e encrypted discord alternative. mossy terminal aesthetic enjoyer 🌿</div>
        <button class="button">request</button>
    </div>
    <div id="modal"></div>
    <div id="toast-zone"></div>
    <div class="header">
        <input type="checkbox" id="sidebar-toggle" class="sidebar-toggle-input" hidden>
        <label for="sidebar-toggle" class="hamburger">☰</label>
        <div class="dots">
            <div class="dot r"></div>
            <div class="dot y"></div>
            <div class="dot g"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user-star preview-icon"><path d="M16.051 12.616a1 1 0 0 1 1.909.024l.737 1.452a1 1 0 0 0 .737.535l1.634.256a1 1 0 0 1 .588 1.806l-1.172 1.168a1 1 0 0 0-.282.866l.259 1.613a1 1 0 0 1-1.541 1.134l-1.465-.75a1 1 0 0 0-.912 0l-1.465.75a1 1 0 0 1-1.539-1.133l.258-1.613a1 1 0 0 0-.282-.866l-1.156-1.153a1 1 0 0 1 .572-1.822l1.633-.256a1 1 0 0 0 .737-.535z"/><path d="M8 15H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/></svg></div>
        </div>
        <span>cicadas</span>
        <div class="account-menu">
            <div style="display: flex; flex-direction: row; gap: .25rem; align-items: center; justify-items: center;"><span id="current-user-username"></span> <div class="avatar-sm"class="avatar-sm" id="corner-pfp"><img src="/pfp/khancri" alt=""></div></div>
            <div class="dropdown" id="account-dropdown">
                <button id="regen-keys">regenerate keys</button>
                <button id="change-pfp">change pfp</button>
                <input type="file" id="pfp-file-input" hidden>
                <button id="customize-profile">customize profile</button>
                <button id="feedback">feedback &#8599</button>
                <button id="logout">logout</button>
                <button id="delete-account">delete account</button>
            </div>
        </div>
    </div>

    <div class="main">
        <div class="sidebar">
            <div id="that-one-container-for-rankings">

                <div id="channelList" class="rankingList">
                    <span class="sidebar-label">channels</span>
                    <div class="empty" id="empty-messages">
                        <p>
                            <p>lonely asf ;(</p>
                        </p>
                    </div>
                </div>
                <hr>
                <div id="dmList" class="rankingList">
                    <span class="sidebar-label">direct messages</span>
                    <div class="empty" id="empty-dms">
                        <p>
                            <p>lonely asf ;(</p>
                        </p>
                    </div>
                </div>
            </div>

            <div class="addChannel">
                <div>
                    <button id="add-new-dm">+ new channel</button>
                    <button class="sidebar-disable"><= Sidebar</button>
                </div>

                <button id="direct-message">+ new DM</button>
            </div>
        </div>
        <div style="display:flex; flex-direction:column; flex:1; overflow:hidden;" id="mainPanel">
            
        </div>
    </div>
</body>
</html>
