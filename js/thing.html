<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>encryption</title>
</head>
<body>
    <button id="create-key">create key</button>
    <input type="text" name="" id="encrypt-content">
    <button id="encrypt">encrypt</button>
    <button id="decrypt">decrypt</button>
    <script>
        async function createKey() {
    return await window.crypto.subtle.generateKey(
        { name: 'AES-GCM', length: 256},
        true,
        ['encrypt', 'decrypt']
    );
}

async function encryptMessage(message, key) {
    const iv = window.crypto.getRandomValues(new Uint8Array(12));

    return [await window.crypto.subtle.encrypt(
        {'name': 'AES-GCM', iv: iv},
        key,
        new TextEncoder().encode(message)
    ), iv]
}

async function decryptMessage(messageBuf, iv, key) {
    return await window.crypto.subtle.decrypt(
        {name: 'AES-GCM', iv: iv},
        key,
        messageBuf
    )}

        var key = null;
        alert('hi')
        document.getElementById('create-key').onclick = async () => {
            alert('hi')
            key = await createKey();
        };
        var encrypted = null;
        document.getElementById('encrypt').onclick = async () => {
            encrypted = await encryptMessage(document.getElementById('encrypt-content').value, key)
            const a = new TextDecoder().decode(encrypted[0])
            alert(a)
        };
        document.getElementById('decrypt').onclick = async () => {
            const decrypted = await decryptMessage(encrypted[0], encrypted[1], key);
            alert(new TextDecoder().decode(decrypted))
        }
    </script>
</body>
</html>
