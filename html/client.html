<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cicadas</title>
    <link rel="stylesheet" href="file/css/base.css">
    <link rel="stylesheet" href="file/css/client.css">
    <link rel="shortcut icon" href="file/svg/favicon.svg" type="image/x-icon">
    <link rel="stylesheet" href="file/css/cropper.css">
</head>
<body>
    <div id="profile-setup">
        <div id="portal">

            <div class="slide" id="username-slide">
                <div class="main">
                    <div class="left">
                        <label for="username-input">pick a name</label>
                        <input type="text" id="username-input" placeholder="something to call you">
                        <input type="file" id="pfp-input" accept="image/*">
                        <button id="username-submit">that's me →</button>
                    </div>
                    <div class="right">
                        <img id="cropImg" style="max-width:100%">
                    </div>
                </div>
                
                <div class="step-dots">
                    <div class="step-dot active"></div>
                    <div class="step-dot"></div>
                </div>
            </div>

            <div class="slide" id="password-slide">
                <label for="password-input">your passphrase</label>
                <input type="password" id="password-input" placeholder="keep it secret">
                <button id="password-submit">mhm →</button>
                <div class="step-dots">
                    <div class="step-dot"></div>
                    <div class="step-dot active"></div>
                </div>
            </div>

        </div>
    </div>
    <script type="module" src="file/js/main.js"></script>
</body>
</html>
