<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cicadas</title>
    <link rel="stylesheet" href="file/css/base.css">
    <link rel="stylesheet" href="file/css/chats.css">
    <script type="module" src="file/js/chats.js" defer></script>
    <link rel="shortcut icon" href="file/svg/favicon.svg" type="image/x-icon">
</head>

<template id="t-channelRanking">
    <div class="dm-item" data-channel-data="paramore">
        <div style="display: flex; gap: 8px; align-items: center;">
            <div class="avatar-sm">#</div><span>paramore</span>
        </div>
        <div class="channel-exit">⤬</div>   
    </div>
</template>

<template id="t-userRanking">
    <div class="dm-item" data-user-data="paramore">
        <div style="display: flex; gap: 8px; align-items: center; overflow: scroll;">
            <div class="avatar-sm"><img src="" alt=""></div><span>paramore</span>
        </div>
        <div class="channel-exit">⤬</div>   
    </div>
</template>

<body>
    <div id="context">
        <button class="emoji-context">react</button>
    </div>
    <div id="toast-zone">
    </div>
    <div class="header">
        <input type="checkbox" id="sidebar-toggle" class="sidebar-toggle-input" hidden>
        <label for="sidebar-toggle" class="hamburger">☰</label>
        <div class="dots">
            <div class="dot r"></div>
            <div class="dot y"></div>
            <div class="dot g"></div>
        </div>
        <span>cicadas</span>
        <div class="account-menu">
            <span id="current-user-username"></span>
            <div class="dropdown" id="account-dropdown">
                <button id="regen-keys">regenerate keys</button>
                <button id="change-pfp">change pfp</button>
                <input type="file" id="pfp-file-input" hidden>
                <button id="logout">logout</button>
            </div>
        </div>
    </div>

    <div class="main">
        <div class="sidebar">
            <div id="that-one-container-for-rankings">

                <div id="channelList" class="rankingList">
                    <span class="sidebar-label">messages</span>
                </div>
                <hr>
                <div id="dmList" class="rankingList">
                    <span class="sidebar-label">direct messages</span>
                </div>
            </div>

            <div class="addChannel">
                <button id="add-new-dm">+ new message</button>
                <button id="direct-message">+ direct message</button>
            </div>
        </div>
        <div style="display:flex; flex-direction:column; flex:1; overflow:hidden;">
            <div id="channel-header">
                <h1 id="channel-name"></h1><span style="color:var(--text-muted); font-size:11px;">end-to-end encrypted</span>
            </div>
            <div class="messages" id="messages"></div>
            <div>
                <div id="typing-indicator">
                    <span class="user">khancri</span> is typing..
                </div>
                <input type="text" id="message-input" placeholder="say something...">
            </div>
        </div>
    </div>
</body>
</html>
